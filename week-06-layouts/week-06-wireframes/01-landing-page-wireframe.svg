<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #2d2d2d; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 14px; }
    .box { fill: #fff; stroke: #555; stroke-width: 2; }
    .soft { fill: #f3f3f3; stroke: #777; stroke-width: 2; }
    .accent { fill: #f5c400; stroke: #555; stroke-width: 2; }
    .line { stroke: #999; stroke-width: 7; stroke-linecap: round; }
    .cross { stroke: #aaa; stroke-width: 2; }
  </style>
  <rect width="1200" height="900" fill="#ececec"/>
  <text x="60" y="48" class="title">Wireframe 1 — Landing Page</text>
  <rect x="60" y="70" width="1080" height="760" class="box"/>

  <!-- Header -->
  <rect x="80" y="90" width="1040" height="70" class="soft"/>
  <rect x="105" y="108" width="235" height="34" class="box"/>
  <text x="137" y="131" class="label">SITE NAME</text>
  <rect x="690" y="108" width="405" height="34" class="box"/>
  <text x="798" y="131" class="label">NAVIGATION</text>

  <!-- Hero -->
  <rect x="80" y="180" width="1040" height="260" class="soft"/>
  <rect x="105" y="205" width="505" height="210" class="box"/>
  <text x="130" y="235" class="label">HERO CONTENT</text>
  <line x1="130" y1="265" x2="500" y2="265" class="line"/>
  <line x1="130" y1="290" x2="545" y2="290" class="line"/>
  <line x1="130" y1="325" x2="500" y2="325" class="line"/>
  <line x1="130" y1="345" x2="445" y2="345" class="line"/>
  <rect x="130" y="370" width="160" height="32" class="accent"/>
  <text x="172" y="392" class="small">CALL TO ACTION</text>
  <rect x="635" y="205" width="460" height="210" class="box"/>
  <line x1="635" y1="205" x2="1095" y2="415" class="cross"/>
  <line x1="1095" y1="205" x2="635" y2="415" class="cross"/>
  <text x="816" y="317" class="label">IMAGE</text>

  <!-- Feature cards -->
  <text x="80" y="480" class="label">VISIT HIGHLIGHTS</text>
  <rect x="80" y="500" width="330" height="145" class="box"/>
  <rect x="435" y="500" width="330" height="145" class="box"/>
  <rect x="790" y="500" width="330" height="145" class="box"/>
  <text x="190" y="575" class="label">FEATURE 1</text>
  <text x="545" y="575" class="label">FEATURE 2</text>
  <text x="900" y="575" class="label">FEATURE 3</text>

  <!-- CTA and footer -->
  <rect x="80" y="670" width="1040" height="85" class="accent"/>
  <text x="105" y="720" class="label">FINAL CALL TO ACTION</text>
  <rect x="900" y="695" width="190" height="36" class="box"/>
  <text x="948" y="719" class="small">BUTTON</text>
  <rect x="80" y="775" width="1040" height="35" fill="#555"/>
  <text x="550" y="798" class="small" style="fill:#fff">FOOTER</text>
</svg>

