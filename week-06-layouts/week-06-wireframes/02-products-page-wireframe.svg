<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #2d2d2d; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 14px; }
    .box { fill: #fff; stroke: #555; stroke-width: 2; }
    .soft { fill: #f3f3f3; stroke: #777; stroke-width: 2; }
    .accent { fill: #f5c400; stroke: #555; stroke-width: 2; }
    .line { stroke: #999; stroke-width: 7; stroke-linecap: round; }
    .cross { stroke: #aaa; stroke-width: 2; }
  </style>
  <rect width="1200" height="900" fill="#ececec"/>
  <text x="60" y="48" class="title">Wireframe 2 — Products Page</text>
  <rect x="60" y="70" width="1080" height="760" class="box"/>

  <!-- Header -->
  <rect x="80" y="90" width="1040" height="70" fill="#555"/>
  <rect x="105" y="108" width="235" height="34" class="box"/>
  <text x="137" y="131" class="label">SITE NAME</text>
  <rect x="690" y="108" width="405" height="34" class="box"/>
  <text x="798" y="131" class="label">NAVIGATION</text>

  <!-- Heading -->
  <rect x="80" y="180" width="1040" height="110" class="soft"/>
  <text x="105" y="215" class="label">PAGE HEADING</text>
  <line x1="105" y1="245" x2="500" y2="245" class="line"/>
  <line x1="105" y1="268" x2="670" y2="268" class="line"/>

  <!-- Sidebar -->
  <rect x="80" y="315" width="245" height="430" class="accent"/>
  <text x="125" y="350" class="label">SHOP INFO</text>
  <line x1="110" y1="385" x2="290" y2="385" class="line"/>
  <line x1="110" y1="410" x2="270" y2="410" class="line"/>
  <line x1="110" y1="465" x2="285" y2="465" class="line"/>
  <line x1="110" y1="490" x2="265" y2="490" class="line"/>
  <line x1="110" y1="545" x2="280" y2="545" class="line"/>
  <line x1="110" y1="570" x2="250" y2="570" class="line"/>

  <!-- Product grid -->
  <g>
    <rect x="350" y="315" width="365" height="200" class="box"/>
    <rect x="735" y="315" width="385" height="200" class="box"/>
    <rect x="350" y="535" width="365" height="210" class="box"/>
    <rect x="735" y="535" width="385" height="210" class="box"/>
  </g>
  <g>
    <rect x="365" y="330" width="135" height="105" class="soft"/><line x1="365" y1="330" x2="500" y2="435" class="cross"/><line x1="500" y1="330" x2="365" y2="435" class="cross"/>
    <rect x="750" y="330" width="140" height="105" class="soft"/><line x1="750" y1="330" x2="890" y2="435" class="cross"/><line x1="890" y1="330" x2="750" y2="435" class="cross"/>
    <rect x="365" y="550" width="135" height="110" class="soft"/><line x1="365" y1="550" x2="500" y2="660" class="cross"/><line x1="500" y1="550" x2="365" y2="660" class="cross"/>
    <rect x="750" y="550" width="140" height="110" class="soft"/><line x1="750" y1="550" x2="890" y2="660" class="cross"/><line x1="890" y1="550" x2="750" y2="660" class="cross"/>
  </g>
  <text x="520" y="375" class="label">PRODUCT 1</text>
  <text x="910" y="375" class="label">PRODUCT 2</text>
  <text x="520" y="595" class="label">PRODUCT 3</text>
  <text x="910" y="595" class="label">PRODUCT 4</text>
  <rect x="520" y="455" width="135" height="30" class="accent"/>
  <rect x="910" y="455" width="135" height="30" class="accent"/>
  <rect x="520" y="680" width="135" height="30" class="accent"/>
  <rect x="910" y="680" width="135" height="30" class="accent"/>

  <rect x="80" y="775" width="1040" height="35" fill="#555"/>
  <text x="550" y="798" class="small" style="fill:#fff">FOOTER</text>
</svg>

