<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Creative branding, digital design and content services from Northline Studio.">

    <title>Northline Studio | Creative Design Services</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<!-- Site header -->
<header class="site-header">
    <div class="container header-layout">

        <a class="site-name" href="index.html">
            Northline <span>Studio</span>
        </a>

        <button class="menu-button"
                type="button"
                aria-controls="main-navigation"
                aria-expanded="false">

            <i class="fa-solid fa-bars"
               aria-hidden="true"></i>

            <span>Menu</span>
        </button>

        <nav id="main-navigation"
             class="main-navigation"
             aria-label="Main navigation">

            <ul class="nav-list">
                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="services.html" aria-current="page">
                        Services
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>
            </ul>

            <ul class="social-links"
                aria-label="Social media links">

                <li>
                    <a href="https://www.instagram.com/"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Instagram, opens in a new tab">

                        <i class="fa-brands fa-instagram"
                           aria-hidden="true"></i>
                    </a>
                </li>

                <li>
                    <a href="https://www.linkedin.com/"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="LinkedIn, opens in a new tab">

                        <i class="fa-brands fa-linkedin-in"
                           aria-hidden="true"></i>
                    </a>
                </li>

                <li>
                    <a href="https://www.pinterest.com/"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Pinterest, opens in a new tab">

                        <i class="fa-brands fa-pinterest-p"
                           aria-hidden="true"></i>
                    </a>
                </li>
            </ul>

        </nav>
    </div>
</header>

<!-- Main page content -->
<main id="main-content">
    <!-- Page-specific content will be added here -->
</main>

<!-- Site footer -->
<footer class="site-footer">
    <div class="container">

        <div class="footer-layout">
            <div>
                <p class="footer-title">
                    Northline Studio
                </p>

                <p class="footer-description">
                    Thoughtful creative services shaped
                    around people, place and purpose.
                </p>
            </div>

            <nav aria-label="Footer navigation">
                <ul class="footer-links">
                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="services.html">
                            Services
                        </a>
                    </li>

                    <li>
                        <a href="about.html">About</a>
                    </li>

                    <li>
                        <a href="contact.html">
                            Contact
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Northline Studio</p>
        </div>

    </div>
</footer>

<script src="js/script.js"></script>
</body>

</html>
